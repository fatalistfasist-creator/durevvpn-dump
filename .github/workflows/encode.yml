name: Encode subscription

on:
  push:
    branches: [main]
    paths:
      - 'subscription.txt'
      - '.github/workflows/encode.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Base64 encode (no wraps)
        run: base64 -w0 subscription.txt > sub.txt

      - name: Commit sub.txt
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          git diff --staged --quiet || git commit -m "chore: regenerate sub.txt (base64)"
          git push
